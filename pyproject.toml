[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "qpy-rsync"
version = "0.2.0"
description = "A PySide6 visual frontend for safe, preview-driven rsync synchronization"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "qpy-rsync contributors" }]
dependencies = ["PySide6>=6.7,<7"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: X11 Applications :: Qt",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Archiving :: Backup",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.7",
  "mypy>=1.11",
]

[project.scripts]
qpy-rsync = "qpy_rsync.app:main"
qpy-rsync-cli = "qpy_rsync.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qpy_rsync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["qpy_rsync"]
